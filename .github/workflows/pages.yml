name: Deploy the demo to GitHub Pages

# The published page runs the real domain in the browser, so a broken rule is
# a broken demo. Typecheck and the full suite gate the deploy: nothing ships
# that does not pass what the module ships with.

on:
  push:
    branches: [claude/tms-module-kabaddi-10avlv, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never interrupt one
# midway — a half-deployed Pages site serves a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Native TypeScript type stripping; the module has no build step of
          # its own and no runtime dependencies.
          node-version: '22'

      - name: Install dev dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the static bundle
        run: npm run build:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
