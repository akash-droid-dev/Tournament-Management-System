name: Deploy the demo to GitHub Pages

# The published page runs the real domain in the browser, so a broken rule is
# a broken demo. Typecheck and the full suite gate the deploy: nothing ships
# that does not pass what the module ships with.

on:
  push:
    branches: [claude/tms-module-kabaddi-10avlv, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy, but never interrupt one
# midway — a half-deployed Pages site serves a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Native TypeScript type stripping; the module has no build step of
          # its own and no runtime dependencies.
          node-version: '22'

      - name: Install dev dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the static bundle
        run: npm run build:static

      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::Enable it once, by hand: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Then re-run this workflow. It cannot be enabled from a workflow: POST /pages is not available to the Actions GITHUB_TOKEN."
            exit 1
          fi
          echo "Pages site present (HTTP $code)."

      # One-time setup, by a repository admin:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      #
      # It cannot be automated from here. `enablement: true` asks
      # configure-pages to create the site over the REST API, and GitHub
      # refuses that for the Actions GITHUB_TOKEN ("Resource not accessible by
      # integration") — POST /repos/:owner/:repo/pages needs a user token with
      # admin rights. So this step assumes the site exists, and the check above
      # explains it if not.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
